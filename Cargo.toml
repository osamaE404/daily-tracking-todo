[package]
name = "gharawi-todo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
